# On-demand WebAssembly (webR) build, for verifying wasm fixes without cutting
# a release.
#
# Adding `workflow_dispatch` to release-file-system-image.yml does not work. That
# workflow delegates to r-wasm/actions/.github/workflows/release-file-system-image.yml@v1,
# whose first step is
#
#   - name: Validate event is release
#     if: github.event_name != 'release'
#     run: exit 1
#
# so a dispatched run would fail immediately without ever compiling anything.
# This workflow instead inlines the same build steps that the reusable workflow
# performs (checkout -> read Config/Needs/wasm -> r-wasm/actions/build-rwasm) and
# uploads the result as a job artifact rather than publishing it to a release.
# Keep those steps in sync with the upstream reusable workflow, otherwise a green
# run here stops being evidence that the release build will succeed.
#
# Trigger from the Actions tab, or:  gh workflow run wasm-check.yml

on:
  workflow_dispatch:

name: wasm build check

jobs:
  wasm-check:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # To download GitHub Packages within the action
      packages: read
      repository-projects: read

    steps:
      - name: Checkout calling repository
        uses: actions/checkout@v4

      - name: Checkout r-wasm/actions repository
        uses: actions/checkout@v4
        with:
          ref: v1
          repository: r-wasm/actions
          token: ${{ secrets.GITHUB_TOKEN }}
          path: .actions

      - name: Find `Config/Needs/wasm` in DESCRIPTION
        id: needs
        shell: Rscript {0}
        run: |
          has_wasm_need <-
            file.exists("DESCRIPTION") &&
            "Config/Needs/wasm" %in% names(as.list(read.dcf("DESCRIPTION")[1,]))
          pkg <- if (has_wasm_need) as.list(read.dcf("DESCRIPTION")[1,])$`Config/Needs/wasm` else ""
          pkg <- paste0(strsplit(pkg, "[[:space:],]+")[[1]], collapse = ",")
          cat("pkg=", pkg, "\n", file = Sys.getenv("GITHUB_OUTPUT"), sep = "", append = TRUE)

      - name: Build wasm image
        uses: ./.actions/build-rwasm
        with:
          packages: |
            .
            ${{ steps.needs.outputs.pkg }}
          strip: "NULL"
          image-path: ._rwasm

      - name: Upload wasm image as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-file-system-image
          path: ._rwasm/*
          if-no-files-found: error
