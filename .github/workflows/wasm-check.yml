# On-demand WebAssembly (webR) build, for verifying wasm fixes without cutting
# a release.
#
# Adding `workflow_dispatch` to release-file-system-image.yml does not work. That
# workflow delegates to r-wasm/actions/.github/workflows/release-file-system-image.yml@v1,
# whose first step is
#
#   - name: Validate event is release
#     if: github.event_name != 'release'
#     run: exit 1
#
# so a dispatched run would fail immediately without ever compiling anything.
# This workflow instead inlines the same build steps that the reusable workflow
# performs (checkout -> read Config/Needs/wasm -> r-wasm/actions/build-rwasm) and
# uploads the result as a job artifact rather than publishing it to a release.
# Keep those steps in sync with the upstream reusable workflow, otherwise a green
# run here stops being evidence that the release build will succeed. One
# deliberate difference: a setup-r step, because ubuntu-24.04 runner images no
# longer ship R and upstream's `shell: Rscript {0}` step therefore dies with
# "Rscript: command not found". Upstream has not added setup-r, so the release
# workflow is expected to fail that way on the next published release until it
# does; this workflow works around it rather than reproducing it.
#
# Note also that the webR failure originally reported for this package came from
# the R-universe builder (r-universe-org/actions/wasm-build), not from
# release-file-system-image.yml. Both compile the package with Emscripten and
# both hit the package's own duplicate-archive-member problem, but they are
# different pipelines - a green run here is evidence, not proof, about R-universe.
#
# Trigger from the Actions tab, or:  gh workflow run wasm-check.yml

on:
  workflow_dispatch:

name: wasm build check

jobs:
  wasm-check:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # To download GitHub Packages within the action
      packages: read
      repository-projects: read

    steps:
      - name: Checkout calling repository
        uses: actions/checkout@v4

      - name: Checkout r-wasm/actions repository
        uses: actions/checkout@v4
        with:
          ref: v1
          repository: r-wasm/actions
          token: ${{ secrets.GITHUB_TOKEN }}
          path: .actions

      # ubuntu-24.04 runner images no longer ship R, so the `shell: Rscript {0}`
      # step below fails with "Rscript: command not found" without this. The
      # upstream reusable workflow has no equivalent step and so is currently
      # broken the same way on ubuntu-latest - see the note at the top of this file.
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Find `Config/Needs/wasm` in DESCRIPTION
        id: needs
        shell: Rscript {0}
        run: |
          has_wasm_need <-
            file.exists("DESCRIPTION") &&
            "Config/Needs/wasm" %in% names(as.list(read.dcf("DESCRIPTION")[1,]))
          pkg <- if (has_wasm_need) as.list(read.dcf("DESCRIPTION")[1,])$`Config/Needs/wasm` else ""
          pkg <- paste0(strsplit(pkg, "[[:space:],]+")[[1]], collapse = ",")
          cat("pkg=", pkg, "\n", file = Sys.getenv("GITHUB_OUTPUT"), sep = "", append = TRUE)

      - name: Build wasm image
        uses: ./.actions/build-rwasm
        with:
          packages: |
            .
            ${{ steps.needs.outputs.pkg }}
          strip: "NULL"
          image-path: ._rwasm

      - name: Upload wasm image as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-file-system-image
          path: ._rwasm/*
          if-no-files-found: error
